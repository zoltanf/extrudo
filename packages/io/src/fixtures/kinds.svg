<?xml version="1.0" encoding="UTF-8"?>
<!-- A hand-written drawing for the SVG reader's tests: every element kind, nested
     transforms, a rounded rectangle, millimetre units and a viewBox. Comments,
     CDATA and the doctype declaration below are skipped. -->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
  <!ENTITY custom "ignored">
]>
<svg xmlns="http://www.w3.org/2000/svg" width='100mm' height="60mm" viewBox="0 0 100 60">
  <title>Kinds</title>
  <style><![CDATA[ .hidden { display: none } ]]></style>
  <desc>A test drawing.</desc>
  <!-- Straight geometry, one element each. -->
  <line x1="0" y1="0" x2="10" y2="0"/>
  <polyline points="0,5 10,5 10,8"/>
  <polygon points="20,0 30,0 30,10"/>
  <circle cx="50" cy="10" r="4"/>
  <ellipse cx="70" cy="10" rx="8" ry="3"/>
  <rect x="0" y="20" width="20" height="10"/>
  <rect x="25" y="20" width="20" height="10" rx="3" ry="2"/>
  <!-- Paths: the relative shorthands, the mirrored control points and both arcs. -->
  <path d="M 50 20 h 10 v 10 h -10 z"/>
  <path d="M70 20C75 20 80 25 80 30S85 40 90 30"/>
  <path d="M 0 40 Q 5 50 10 40 T 20 40"/>
  <path d="M 30 40a5 5 0 0 1 10 0a5 5 0 1 1 -10 0z"/>
  <!-- Numbers written the way a file may: no separators, an exponent, a sign. -->
  <path d="M0.5.5L1.5.5 2.5-1e0"/>
  <!-- Nested transforms: a group, a rotation about a point, an unequal scale. -->
  <g transform="translate(0,50)">
    <rect x="0" y="0" width="10" height="5"/>
    <g transform="rotate(90 5 2.5)">
      <line x1="0" y1="0" x2="10" y2="0"/>
    </g>
    <g transform="scale(2 1)">
      <circle cx="20" cy="2" r="2"/>
    </g>
    <g transform="matrix(1 0 0 1 30 0) skewX(10)">
      <rect x="0" y="0" width="4" height="4"/>
    </g>
  </g>
  <!-- Not drawn. -->
  <g display="none">
    <line x1="0" y1="0" x2="5" y2="5"/>
  </g>
  <line x1="0" y1="0" x2="1" y2="1" style="display:none"/>
  <!-- Left out and counted. -->
  <text x="60" y="50">Hello &amp; goodbye</text>
  <image href="pic.png" x="70" y="45" width="10" height="10"/>
  <use href="#k"/>
  <defs>
    <path d="M0 0 L1 1"/>
  </defs>
  <clipPath id="c">
    <rect x="0" y="0" width="1" height="1"/>
  </clipPath>
</svg>
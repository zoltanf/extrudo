# Temporary: runs CI's size check in a loop to catch the run that never exits,
# and dumps the stuck process's threads. Removed before the branch is merged.
name: Size check hang probe

on:
  push:
    branches: [claude/ci-size-check-hang]

jobs:
  probe:
    name: Size check loop ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm wasm

      - run: pnpm --filter @extrudo/web build

      - name: The size check in a loop, with a watchdog
        run: |
          node --version
          sudo apt-get install -y -qq gdb > /dev/null 2>&1 || echo "no gdb"
          end=$((SECONDS + 40 * 60))
          i=0
          hung=0
          while [ $SECONDS -lt $end ]; do
            i=$((i + 1))
            start=$SECONDS
            # stdout through a pipe, as in the real step.
            node scripts/measure-startup.mjs --no-browser --budget > >(cat > out.txt) 2>&1 &
            pid=$!
            while kill -0 $pid 2> /dev/null && [ $((SECONDS - start)) -lt 240 ]; do sleep 1; done
            if kill -0 $pid 2> /dev/null; then
              hung=$((hung + 1))
              echo "::warning::run $i still running after 240 s; last line: $(tail -1 out.txt)"
              for t in /proc/$pid/task/*; do
                echo "thread $(basename "$t") $(cat "$t/comm") wchan=$(cat "$t/wchan") state=$(awk '{print $3}' "$t/stat")"
                sudo cat "$t/stack" 2> /dev/null | head -8 | sed 's/^/    /'
              done
              sudo gdb -batch -p $pid -ex 'info threads' -ex 'thread apply all bt 30' 2>&1 | grep -v '^\[New LWP' | head -400
              kill -9 $pid
            else
              wait $pid
              echo "run $i: exit $? after $((SECONDS - start)) s; last line: $(tail -1 out.txt)"
            fi
          done
          echo "$hung of $i runs hung"

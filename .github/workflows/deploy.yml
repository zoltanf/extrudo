name: Deploy

# Publishes Extrudo to Cloudflare Pages (ADR-0054, ADR-0057, docs/deploy.md):
#
# - The landing page (apps/site) → Pages project "extrudo-site", production:
#   https://extrudo.org. After every green CI run on main.
# - The latest build of the app (apps/web) → Pages project "extrudo", branch
#   "edge": https://edge.extrudo.org. After every green CI run on main.
# - The stable app → Pages project "extrudo", production branch "main":
#   https://app.extrudo.org. Only for a release tag (v*), and only if CI passed
#   for that commit on main; or by hand ("Run workflow", target "stable"), which
#   deploys the commit named by "ref" (a tag such as v0.3.0, or main). By hand is
#   how v0.3.0 itself goes out: it predates this workflow, and a tag runs the
#   workflow file of the tagged commit.
#
# A commit that fails its checks or end-to-end tests is never deployed. Nothing
# runs, and it says so, until the owner has added the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, so a fork skips cleanly.
#
# The Docker image of the app (ADR-0091) goes to ghcr.io/<owner>/extrudo on the
# same triggers: "edge" after a green CI run on main; "X.Y.Z", "X.Y" and "latest"
# for a release (a tag, or the manual stable target). It needs no Cloudflare
# secrets, so a fork publishes its image too.
#
# Addresses come from the optional repository variables SITE_URL, APP_URL and
# EDGE_URL (defaults: extrudo.org, app.extrudo.org, edge.extrudo.org).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [edge-and-site, stable]
        default: edge-and-site
      ref:
        description: Commit to deploy as stable (a tag like v0.3.0, a SHA, or main); edge and site always use main
        type: string
        default: main

# One deployment at a time; a newer one waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SITE_URL: ${{ vars.SITE_URL || 'https://extrudo.org' }}
  APP_URL: ${{ vars.APP_URL || 'https://app.extrudo.org' }}
  EDGE_URL: ${{ vars.EDGE_URL || 'https://edge.extrudo.org' }}
  # A pinned wrangler through npx, outside the workspace: wrangler-action sees
  # pnpm and runs `pnpm add wrangler` in the workspace root, which pnpm refuses.
  WRANGLER: npx --yes wrangler@4.146.0

jobs:
  plan:
    name: Decide what to deploy
    # The runner: GitHub-hosted ubuntu-latest, or the JSON label list in the
    # repository variable RUNS_ON when the self-hosted backup is switched on (docs/deploy.md, "Self-hosted runner (backup)").
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      sha: ${{ steps.plan.outputs.sha }}
      edge: ${{ steps.plan.outputs.edge }}
      stable: ${{ steps.plan.outputs.stable }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET: ${{ inputs.target }}
      STABLE_REF: ${{ inputs.ref }}
      REF: ${{ github.ref }}
    steps:
      - id: plan
        run: |
          edge=false; stable=false; sha=""
          case "$EVENT" in
            workflow_run)
              if [ "$RUN_CONCLUSION" = success ] && [ "$RUN_EVENT" = push ]; then
                edge=true; sha="$RUN_SHA"
              fi ;;
            push)
              # A release tag: deploy it as stable only if CI passed for this commit on main.
              sha="$GITHUB_SHA"
              ok=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -c "$sha" -s success --json databaseId --jq length)
              if [ "$ok" -gt 0 ]; then
                stable=true
              else
                echo "::error title=Not deployed::CI has not passed for $sha on main. Tag a commit of main after its CI run succeeded, or re-run this workflow once it has."
                exit 1
              fi ;;
            workflow_dispatch)
              if [ "$REF" != refs/heads/main ]; then
                echo "::error::Run this workflow on main."; exit 1
              fi
              sha="$GITHUB_SHA"
              if [ "$TARGET" = stable ]; then
                # The named commit, and only if CI passed for it on main.
                sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${STABLE_REF:-main}" --jq .sha)
                ok=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -c "$sha" -s success --json databaseId --jq length)
                if [ "$ok" -gt 0 ]; then
                  stable=true
                else
                  echo "::error title=Not deployed::CI has not passed for $sha (${STABLE_REF}) on main."
                  exit 1
                fi
              else
                edge=true
              fi ;;
          esac
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            enabled=true
          else
            enabled=false
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets, so nothing was deployed. See docs/deploy.md."
          fi
          { echo "enabled=$enabled"; echo "sha=$sha"; echo "edge=$edge"; echo "stable=$stable"; } >> "$GITHUB_OUTPUT"
          echo "sha=$sha edge=$edge stable=$stable enabled=$enabled"

  app:
    name: App (${{ matrix.channel }})
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        channel: [edge, stable]
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      WANTED: ${{ matrix.channel == 'edge' && needs.plan.outputs.edge || needs.plan.outputs.stable }}
      # Pages: the production branch "main" is app.extrudo.org, the branch "edge" is
      # edge.<project>.pages.dev, which edge.extrudo.org points at.
      PAGES_BRANCH: ${{ matrix.channel == 'edge' && 'edge' || 'main' }}
    steps:
      - name: Skip what this run doesn't deploy
        id: gate
        run: echo "run=$WANTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # git describe in the build needs the tags and history

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      # Both channels name the stable app as the canonical address (the edge build is
      # a preview of it); the build reads SITE_URL (apps/web/pwa/site.ts).
      - name: Build (downloads the published WASM first)
        if: steps.gate.outputs.run == 'true'
        env:
          EXTRUDO_CHANNEL: ${{ matrix.channel }}
        run: SITE_URL="$APP_URL" pnpm build

      - name: Deploy apps/web/dist to the Pages project "extrudo" (${{ env.PAGES_BRANCH }})
        if: steps.gate.outputs.run == 'true'
        run: >-
          $WRANGLER pages deploy apps/web/dist
          --project-name=extrudo --branch="$PAGES_BRANCH" --commit-hash="$SHA"

  docker:
    name: Docker image
    needs: plan
    # Not gated on `enabled`: the image needs the GITHUB_TOKEN only (ADR-0091 §4).
    if: needs.plan.outputs.sha != '' && (needs.plan.outputs.edge == 'true' || needs.plan.outputs.stable == 'true')
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      STABLE: ${{ needs.plan.outputs.stable }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0 # git describe in the build needs the tags and history

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same app build as the Pages deploy; the image names the public app as canonical.
      - name: Build the app (downloads the published WASM first)
        env:
          EXTRUDO_CHANNEL: ${{ needs.plan.outputs.stable == 'true' && 'stable' || 'edge' }}
        run: |
          pnpm wasm
          SITE_URL="$APP_URL" pnpm --filter @extrudo/web build

      # Stable: the version of the release tag at this commit; edge: the "edge" tag.
      - name: Work out the image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            if [ "$STABLE" = true ]; then
              version=$(git describe --tags --abbrev=0 --match 'v*' "$SHA")
              version="${version#v}"
              echo "type=raw,value=$version"
              echo "type=raw,value=${version%.*}"
              echo "type=raw,value=latest"
            else
              echo "type=raw,value=edge"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags (lower-cased owner) and the OCI labels: source, revision, version, licence.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.tags.outputs.list }}

      # Build for this runner's architecture first and smoke-test it before anything is pushed.
      - name: Build the image for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: extrudo:smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Serve the image and check its responses
        run: |
          docker run -d --rm --name extrudo-smoke -p 8080:80 extrudo:smoke
          scripts/docker-smoke.sh
          docker stop extrudo-smoke

      - name: Push for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site:
    name: Landing page
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.edge == 'true'
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @extrudo/site build
      # The project is created on the first run (direct upload, production branch main).
      - name: Make sure the Pages project "extrudo-site" exists
        run: |
          if ! $WRANGLER pages project list | grep -q 'extrudo-site'; then
            $WRANGLER pages project create extrudo-site --production-branch=main
          fi
      - name: Deploy apps/site/dist to the Pages project "extrudo-site"
        run: >-
          $WRANGLER pages deploy apps/site/dist
          --project-name=extrudo-site --branch=main --commit-hash="$SHA"

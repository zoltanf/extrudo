name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs build the OCCT WASM of a branch's inputs (e.g. a trim experiment).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occt:
    # Our OCCT WASM (packages/kernel/occt) takes about 10+ minutes to build in
    # Docker, so it is built once per input hash and published as a release
    # asset (`occt-<hash>`). This job is a quick no-op when that release exists.
    name: OCCT WASM
    # The runner: GitHub-hosted ubuntu-latest, or the JSON label list in the
    # repository variable RUNS_ON when the self-hosted backup is switched on (docs/deploy.md, "Self-hosted runner (backup)").
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a published build of these inputs
        id: release
        run: |
          echo "hash=$(node packages/kernel/occt/occt.mjs hash)" >> "$GITHUB_OUTPUT"
          if node packages/kernel/occt/occt.mjs exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space for the build image (about 13 GB unpacked)
        if: steps.release.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@v6
        if: steps.release.outputs.exists == 'false'

      - uses: actions/setup-node@v5
        if: steps.release.outputs.exists == 'false'
        with:
          node-version: 24
          cache: pnpm

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm occt build

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        run: pnpm occt publish

  planegcs:
    # Our planegcs WASM (packages/sketch/planegcs, ADR-0002) builds in Docker in
    # a few minutes, so like OCCT it is built once per input hash and published
    # as a release asset (`planegcs-<hash>`). A quick no-op when that exists.
    name: planegcs WASM
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a published build of these inputs
        id: release
        run: |
          echo "hash=$(node packages/sketch/planegcs/planegcs.mjs hash)" >> "$GITHUB_OUTPUT"
          if node packages/sketch/planegcs/planegcs.mjs exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: node packages/sketch/planegcs/planegcs.mjs build

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        run: node packages/sketch/planegcs/planegcs.mjs publish

  openscad:
    # OpenSCAD's own WebAssembly snapshot (packages/openscad, ADR-0071 §1):
    # files.openscad.org prunes snapshots after some months, so the pinned one
    # is mirrored as a release asset (`openscad-<hash>`). The "build" is a
    # download, a checksum and a one-line patch. A quick no-op when it exists.
    name: OpenSCAD WASM mirror
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a published mirror of these inputs
        id: release
        run: |
          echo "hash=$(node packages/openscad/openscad.mjs hash)" >> "$GITHUB_OUTPUT"
          if node packages/openscad/openscad.mjs exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: node packages/openscad/openscad.mjs build

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        run: node packages/openscad/openscad.mjs publish

  check:
    name: Typecheck, lint, unit and memory tests
    needs: [occt, planegcs, openscad]
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history so the changelog check's `--base origin/<base_ref>` three-dot
      # diff has the merge base (ADR-0089); the other jobs keep the shallow default.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: A pull request must not edit docs/CHANGELOG.md (ADR-0089)
        if: github.event_name == 'pull_request'
        run: node scripts/check-changelog.mjs --base "origin/${{ github.base_ref }}"

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the OCCT, planegcs and OpenSCAD WASM
        run: pnpm wasm

      - name: Typecheck, lint, package boundaries, bindings, unit and memory tests
        run: pnpm check

  storage-windows:
    name: Storage tests (Windows)
    # The Node-fs store runs on every desktop OS; fsync through a read-only
    # handle failed with EPERM on Windows (v0.7.0), unseen on Linux. The
    # desktop workflow repeats these tests at packaging time.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/storage/src/node

  e2e:
    # Four shards beside the check job, each on its own runner. The shards are
    # cut by duration, not by test count: scripts/e2e-shards.ts deals the spec
    # files from e2e/timings.json (E2E_SHARD below; Playwright's own --shard put
    # the long benchmark specs together, 22.7 min against 8.5 on 2026-10-18).
    # Change the count in all three places: the name, the matrix and E2E_SHARD.
    name: E2E tests (${{ matrix.shard }}/4)
    needs: [occt, planegcs, openscad]
    runs-on: ${{ vars.RUNS_ON && fromJSON(vars.RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GH_TOKEN: ${{ github.token }}
      E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the OCCT, planegcs and OpenSCAD WASM
        run: pnpm wasm

      # WebKit runs only e2e/webkit-smoke.spec.ts (the `webkit` project), so only
      # the shard that has that file installs it.
      - name: Install Playwright Chromium (and WebKit where its spec runs)
        run: pnpm exec playwright install --with-deps chromium $(node scripts/e2e-shards.ts browsers)

      - name: Build
        run: pnpm build

      # Playwright through node, not pnpm (see playwright.config.ts's webServer).
      - name: E2E tests
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload the JSON report (per-test durations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: playwright-results.json
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

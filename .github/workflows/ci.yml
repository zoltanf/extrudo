name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs build the OCCT WASM of a branch's inputs (e.g. a trim experiment).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occt:
    # Our OCCT WASM (packages/kernel/occt) takes about 10+ minutes to build in
    # Docker, so it is built once per input hash and published as a release
    # asset (`occt-<hash>`). This job is a quick no-op when that release exists.
    name: OCCT WASM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a published build of these inputs
        id: release
        run: |
          echo "hash=$(node packages/kernel/occt/occt.mjs hash)" >> "$GITHUB_OUTPUT"
          if node packages/kernel/occt/occt.mjs exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space for the build image (about 13 GB unpacked)
        if: steps.release.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@v6
        if: steps.release.outputs.exists == 'false'

      - uses: actions/setup-node@v5
        if: steps.release.outputs.exists == 'false'
        with:
          node-version: 24
          cache: pnpm

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm occt build

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        run: pnpm occt publish

  planegcs:
    # Our planegcs WASM (packages/sketch/planegcs, ADR-0002) builds in Docker in
    # a few minutes, so like OCCT it is built once per input hash and published
    # as a release asset (`planegcs-<hash>`). A quick no-op when that exists.
    name: planegcs WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a published build of these inputs
        id: release
        run: |
          echo "hash=$(node packages/sketch/planegcs/planegcs.mjs hash)" >> "$GITHUB_OUTPUT"
          if node packages/sketch/planegcs/planegcs.mjs exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: node packages/sketch/planegcs/planegcs.mjs build

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        run: node packages/sketch/planegcs/planegcs.mjs publish

  check:
    name: Typecheck, lint, unit and memory tests
    needs: [occt, planegcs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the OCCT and planegcs WASM
        run: pnpm wasm

      - name: Typecheck, lint, package boundaries, bindings, unit and memory tests
        run: pnpm check

  e2e:
    # The runner gives Playwright one worker, and one job ran the whole suite in
    # about 20 minutes by P3-14 (178 tests; the job with `pnpm check` before it
    # took 27-33). Two shards run beside the check job, each on its own runner.
    name: E2E tests (${{ matrix.shard }}/2)
    needs: [occt, planegcs]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the OCCT and planegcs WASM
        run: pnpm wasm

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Playwright through node, not pnpm (see playwright.config.ts's webServer).
      - name: E2E tests
        run: node node_modules/@playwright/test/cli.js test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

name: Desktop

# Unsigned installers of the Electron app (P6-01 slice 3, ADR-0075's amendment).
# Never per push: it is three OS runners a build. A `v*` tag builds them and
# attaches them to a DRAFT GitHub release (the owner publishes it); a manual run
# only uploads workflow artifacts, the updater's `latest*.yml` manifests among
# them (P6-01 slice 4: a published release is what electron-updater reads).
#
# The WASM downloads need the `occt-<hash>`, `planegcs-<hash>` and
# `openscad-<hash>` releases of this commit's inputs, which CI's first three jobs
# publish: run this after CI has run for the commit (a tag on main always has).
#
# On a tag the `homebrew` job also renders the Homebrew cask from the arm64 mac
# zip and pushes it to the zoltanf/homebrew-extrudo tap (P6-01, ADR-0075's
# amendment); it needs the `HOMEBREW_TAP_TOKEN` secret and skips cleanly
# without it (docs/release-checklist.md).
#
# Two paths reach that job. The tag path is the one above: the package jobs
# built the zip in this run. The cask path is a manual run with `cask_tag` set
# (e.g. `gh workflow run desktop.yml --ref main -f cask_tag=v0.4.1`): it pushes
# the cask for a tag that already exists, takes the zip from that tag's release
# and runs nothing else, since `draft` and `package` are skipped on it.
on:
  workflow_dispatch:
    inputs:
      cask_tag:
        description: "Push the Homebrew cask for this existing tag, e.g. v0.4.1; leave empty for a normal manual run"
        type: string
        default: ''
        required: false
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    # One draft release per tag, made before the three package jobs upload into
    # it (electron-builder would otherwise race to create it three times).
    # Not on the cask path (`cask_tag`): that tag's release already exists.
    name: Draft release
    if: ${{ inputs.cask_tag == '' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the draft if there is none
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --draft --verify-tag --title "Extrudo ${GITHUB_REF_NAME#v}" \
                 --notes "Unsigned desktop installers (P6-01 slice 3)."

  package:
    name: Package (${{ matrix.os }})
    needs: [draft]
    # `draft` is skipped on a manual run; the package jobs still go on. Not on
    # the cask path (`cask_tag`), which only publishes the cask.
    if: ${{ inputs.cask_tag == '' && !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest }
          - { os: win, runner: windows-latest }
          - { os: mac, runner: macos-latest }
    env:
      GH_TOKEN: ${{ github.token }}
      # No signing yet (slice 5): do not look for a macOS identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the OCCT, planegcs and OpenSCAD WASM
        run: pnpm wasm

      # The workspace keeps `electron: false` in allowBuilds, so the binary is
      # fetched here and only here (the smoke script needs it on Linux).
      - name: Download Electron's binary
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build the app
        run: pnpm --filter @extrudo/desktop build

      - name: Package (workflow artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @extrudo/desktop exec electron-builder --${{ matrix.os }} --publish never

      - name: Package and attach to the draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm --filter @extrudo/desktop exec electron-builder --${{ matrix.os }} --publish onTag

      - name: Installers
        run: ls -l apps/desktop/release

      - uses: actions/upload-artifact@v4
        with:
          name: extrudo-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

      # Windows and macOS only build here; their smoke runs come with signing
      # (slice 5).
      - name: Smoke-test the AppImage
        if: ${{ matrix.os == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64 libgtk-3-0t64 libnss3
          chmod +x apps/desktop/release/*.AppImage
          xvfb-run -a node apps/desktop/scripts/smoke.mjs --app apps/desktop/release/extrudo-*.AppImage

  homebrew:
    # Render the cask from the arm64 mac zip and push it to the tap (P6-01,
    # ADR-0075's amendment). Two paths, both skipped cleanly when
    # HOMEBREW_TAP_TOKEN is absent:
    # - tag runs: the zip the package jobs just built (the workflow artifact);
    # - cask path (`cask_tag` set, a manual run): the zip of that existing tag's
    #   release, and nothing else runs, since `package` is skipped. `always()`
    #   lets the job start when `package` is skipped; the conditions then say
    #   which skip is the cask path and which success is the tag path.
    name: Homebrew cask
    needs: [package]
    if: ${{ always() && !cancelled() && ((inputs.cask_tag != '' && needs.package.result == 'skipped') || (startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The job never installs pnpm, so setup-node must not look for it: its
      # package-manager cache is on by default and fails without pnpm on PATH.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Work out the tag and the version
        id: version
        env:
          CASK_TAG: ${{ inputs.cask_tag }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ -n "$CASK_TAG" ]; then
            if ! [[ "$CASK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "cask_tag must look like v0.4.1 (x.y.z after a v), got: $CASK_TAG" >&2
              exit 1
            fi
            tag="$CASK_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tap token
        id: token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "HOMEBREW_TAP_TOKEN is not set: the cask is not pushed (docs/release-checklist.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the mac package artifact (tag runs)
        if: ${{ steps.token.outputs.present == 'true' && inputs.cask_tag == '' }}
        uses: actions/download-artifact@v4
        with:
          name: extrudo-desktop-mac

      # The release is the one `draft` made and the package jobs attached to; a
      # draft is visible to the repository's own token.
      - name: Download the mac zip from the tag's release (cask path)
        if: ${{ steps.token.outputs.present == 'true' && inputs.cask_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "extrudo-${VERSION}-mac-arm64.zip"

      - name: Render and push the cask
        if: steps.token.outputs.present == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          zip=$(ls "extrudo-${version}-mac-arm64.zip" 2>/dev/null || true)
          if [ -z "$zip" ]; then
            ls extrudo-*-mac-arm64.zip 2>/dev/null || true
            echo "The arm64 mac zip for ${version} is not in the extrudo-desktop-mac artifact or the release." >&2
            exit 1
          fi
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          node apps/desktop/homebrew/render.mjs "$version" "$sha" > cask.rb
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/zoltanf/homebrew-extrudo.git" tap
          mkdir -p tap/Casks
          cp cask.rb tap/Casks/extrudo.rb
          git -C tap config user.name "Extrudo release bot"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/extrudo.rb
          # A re-run of the cask path for a tag already pushed has nothing new.
          if git -C tap diff --cached --quiet; then
            echo "The tap already has this cask: nothing to push."
          else
            git -C tap commit -m "Extrudo ${version}"
            git -C tap push origin HEAD
          fi

<!doctype html>
<html lang="en" data-theme="dark">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Extrudo: open-source parametric CAD for 3D printing, in your browser." />

    <meta name="theme-color" content="#1B1F27" />

      content="The Extrudo logo: a dashed blue sketch square turning into an amber solid."

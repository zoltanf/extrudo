# electron-builder configuration (P6-01, ADR-0075 §2/§5, slice 3).
#
# Installers for Linux, Windows and macOS. The `desktop` workflow runs
# this on a runner per OS; macOS is ad-hoc signed, there is no Apple
# certificate or notarisation yet (the owner, ADR-0075). Auto-update (slice 4) reads the `publish` block below:
# electron-builder writes it into the package as `app-update.yml` and the
# `latest*.yml` manifests beside the installers. The `.extrudo` file association the OS
# registers lives here and not in the menu code.
appId: org.extrudo.desktop
productName: Extrudo
executableName: extrudo
copyright: Copyright © Extrudo contributors
artifactName: extrudo-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Everything the app needs is bundled into `out` by electron-vite (the
# workspace packages are devDependencies), so the archive holds no node_modules.
asar: true
files:
  - out/**/*
  - '!**/*.map'
  - package.json

# The `.extrudo` document, registered with the OS. The extension is the one
# `@extrudo/core` declares (FILE_EXTENSION).
fileAssociations:
  - ext: extrudo
    name: Extrudo Design
    description: Extrudo parametric design
    role: Editor

linux:
  category: Graphics
  maintainer: Extrudo contributors <conduct@extrudo.org>
  vendor: Extrudo
  synopsis: Parametric CAD for 3D printing
  description: Open-source parametric CAD with a sketch, features and timeline workflow.
  mimeTypes:
    - application/x-extrudo
  # electron-builder writes `Exec=<binary> %U` itself (it refuses a custom Exec),
  # so a double-clicked `.extrudo` reaches argv (main/openPaths.ts).
  target:
    - AppImage
    - deb

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.graphics-design
  # The top-level `executableName: extrudo` (Linux) would also name the bundle
  # `extrudo.app`; the cask, the docs and Finder expect `Extrudo.app`.
  executableName: Extrudo
  # Ad-hoc signed (ADR-0075's 2026-10-10 amendment): no Apple certificate yet,
  # but `identity: null` left a bundle whose linker signature no longer matched
  # its edited Info.plist, which Apple silicon reports as "damaged" once it is
  # quarantined. `-` makes electron-builder sign every Mach-O ad hoc during
  # packaging, before the zip and dmg are made (MacTargetHelper's
  # `qualifier === "-"` branch). No notarisation. The hardened runtime would
  # need entitlements for Electron's JIT, so it stays off.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  # Apple's icon grid (824 px square inside 1024); the others stay full-bleed.
  icon: build/icon-mac.png
  target:
    - dmg
    - zip

publish:
  provider: github
  owner: zoltanf
  repo: extrudo
  releaseType: draft

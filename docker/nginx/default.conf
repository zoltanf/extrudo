# The Extrudo image's one server (ADR-0091). The response headers come from
# headers.conf and the maps in conf.d/00-maps.conf, both generated from
# apps/web/public/_headers (`pnpm docker:headers`). Never put an add_header inside
# a location: it would replace the ones included here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/extrudo/headers.conf;

  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;

  # Unknown paths get the app, as on the hosted site.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

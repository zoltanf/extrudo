packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  # Electron's binary is not downloaded: the desktop tests and the build do not
  # need it, and CI must not spend the download (ADR-0075 §4). The smoke script
  # says so when the binary is missing.
  electron: false
  # electron-builder's Squirrel.Windows helper; we build NSIS, not Squirrel.
  electron-winstaller: false
overrides:
  # electron-builder 26 (packaging only, nothing of it ships) still asks for
  # minimatch 10 and 9, which GHSA-g3hv-75wg-m249 covers; 11.0.1 is the first
  # fixed release. Both parents only use `new Minimatch`, `.set`, `.negate`,
  # `.match` and `minimatch(path, pattern, { matchBase })`, which 11 keeps. Drop
  # these when electron-builder's own ranges allow 11.
  app-builder-lib>minimatch: ^11.0.1
  '@electron/universal>minimatch': ^11.0.1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230">
  <title>The Dimension tool in three panels: click two points for their distance, two lines for their angle, a circle for its diameter</title>
  <rect x="10" y="10" width="160" height="180" class="sk-ui" rx="8" stroke-width="1"/>
  <rect x="180" y="10" width="160" height="180" class="sk-ui" rx="8" stroke-width="1"/>
  <rect x="350" y="10" width="160" height="180" class="sk-ui" rx="8" stroke-width="1"/>
  <text x="90" y="212" class="sk-muted" text-anchor="middle" font-size="11">Two points: the distance</text>
  <text x="260" y="212" class="sk-muted" text-anchor="middle" font-size="11">Two lines: the angle</text>
  <text x="430" y="212" class="sk-muted" text-anchor="middle" font-size="11">A circle: the diameter</text>
  <circle cx="36" cy="100" r="3.5" class="sk-point"/>
  <circle cx="144" cy="100" r="3.5" class="sk-point"/>
  <line x1="36" y1="106" x2="36" y2="136" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="144" y1="106" x2="144" y2="136" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="36" y1="132" x2="144" y2="132" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="90" y="127" class="sk-dim-text" text-anchor="middle" font-size="12" font-weight="600">42</text>
  <circle cx="36" cy="66" r="9" class="sk-step"/>
  <text x="36" y="70" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <circle cx="144" cy="66" r="9" class="sk-step"/>
  <text x="144" y="70" class="sk-step-text" text-anchor="middle" font-size="11">2</text>
  <circle cx="90" cy="162" r="9" class="sk-step"/>
  <text x="90" y="166" class="sk-step-text" text-anchor="middle" font-size="11">3</text>
  <line x1="215" y1="150" x2="325" y2="150" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="215" y1="150" x2="305" y2="85" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M265 150A50 50 0 0 0 255.5 120.8" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="283" y="138" class="sk-dim-text" font-size="12" font-weight="600">36°</text>
  <circle cx="300" cy="170" r="9" class="sk-step"/>
  <text x="300" y="174" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <circle cx="270" cy="80" r="9" class="sk-step"/>
  <text x="270" y="84" class="sk-step-text" text-anchor="middle" font-size="11">2</text>
  <circle cx="324" cy="116" r="9" class="sk-step"/>
  <text x="324" y="120" class="sk-step-text" text-anchor="middle" font-size="11">3</text>
  <circle cx="430" cy="100" r="36" class="sk-free" fill="none" stroke-width="2.4"/>
  <line x1="394" y1="100" x2="472" y2="100" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="476" y="104" class="sk-dim-text" font-size="12" font-weight="600">⌀16</text>
  <circle cx="372" cy="56" r="9" class="sk-step"/>
  <text x="372" y="60" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <circle cx="490" cy="72" r="9" class="sk-step"/>
  <text x="490" y="76" class="sk-step-text" text-anchor="middle" font-size="11">2</text>
</svg>

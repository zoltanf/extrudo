<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180">
  <title>Drawing a line: a click sets the start, the line follows the pointer, the heads-up box takes a length then Tab an angle, and a second click or Enter ends it</title>
  <line x1="70" y1="150" x2="243" y2="50" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="70" cy="150" r="3.5" class="sk-point"/>
  <circle cx="46" cy="130" r="9" class="sk-step"/>
  <text x="46" y="134" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <path d="M243 50 239 74 247 68 253 78 257 75 251 65 261 63Z" class="sk-pointer" fill="none" stroke-width="2" stroke-linejoin="round"/>
  <rect x="276" y="22" width="64" height="24" class="sk-ui" rx="5"/>
  <text x="308" y="38" class="sk-ui-text" text-anchor="middle" font-size="11">40 mm</text>
  <rect x="348" y="24" width="36" height="20" class="sk-ui" rx="4"/>
  <text x="366" y="38" class="sk-muted" text-anchor="middle" font-size="11">Tab</text>
  <rect x="392" y="22" width="52" height="24" class="sk-ui" rx="5"/>
  <text x="418" y="38" class="sk-ui-text" text-anchor="middle" font-size="11">30°</text>
  <circle cx="212" cy="34" r="9" class="sk-step"/>
  <text x="212" y="38" class="sk-step-text" text-anchor="middle" font-size="11">2</text>
</svg>

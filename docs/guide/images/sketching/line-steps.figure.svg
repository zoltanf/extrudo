<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180">
  <title>Drawing a line: a click sets the start, the heads-up box takes a length then Tab an angle, giving a line dimensioned 40 at 30 degrees</title>
  <line x1="70" y1="150" x2="243" y2="50" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="70" cy="150" r="9" class="sk-step"/>
  <text x="70" y="154" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <rect x="185" y="28" width="46" height="24" class="sk-ui" rx="5"/>
  <text x="208" y="44" class="sk-ui-text" text-anchor="middle" font-size="11">40</text>
  <text x="262" y="74" class="sk-muted" font-size="11">Tab</text>
  <rect x="300" y="50" width="52" height="24" class="sk-ui" rx="5"/>
  <text x="326" y="66" class="sk-ui-text" text-anchor="middle" font-size="11">30°</text>
  <line x1="70" y1="150" x2="74" y2="166" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="243" y1="50" x2="247" y2="66" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="74" y1="166" x2="247" y2="66" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="168" y="129" class="sk-dim-text" text-anchor="middle" font-size="12" font-weight="600">40</text>
  <line x1="70" y1="150" x2="250" y2="150" class="sk-dim" fill="none" stroke-width="1" stroke-dasharray="6 4"/>
  <path d="M165 150A95 95 0 0 0 152.3 102.5" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="122" y="102" class="sk-dim-text" font-size="12" font-weight="600">30°</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220">
  <title>Sketch Fillet: click the two lines of a corner, type the radius, and the corner is rounded by a tangent arc dimensioned R 3</title>
  <line x1="70" y1="20" x2="70" y2="180" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="70" y1="180" x2="230" y2="180" class="sk-free" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="70" cy="180" r="3.5" class="sk-point"/>
  <circle cx="102" cy="90" r="9" class="sk-step"/>
  <text x="102" y="94" class="sk-step-text" text-anchor="middle" font-size="11">1</text>
  <circle cx="150" cy="146" r="9" class="sk-step"/>
  <text x="150" y="150" class="sk-step-text" text-anchor="middle" font-size="11">2</text>
  <path d="M258 100h14m-6 -5 6 5-6 5" class="sk-muted" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 20V144A36 36 0 0 0 366 180H490" class="sk-free" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

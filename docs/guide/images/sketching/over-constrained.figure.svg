<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220">
  <title>A rectangle with a width and two height dimensions; the repeated heights are red, and a dialog strip says it is over-constrained</title>
  <rect x="140" y="50" width="240" height="90" class="sk-free" fill="none" stroke-width="2.4" rx="2"/>
  <line x1="140" y1="50" x2="140" y2="140" class="sk-conflict" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="380" y1="50" x2="380" y2="140" class="sk-conflict" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="140" y1="158" x2="140" y2="178" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="380" y1="158" x2="380" y2="178" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="140" y1="174" x2="380" y2="174" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="260" y="168" class="sk-dim-text" text-anchor="middle" font-size="12" font-weight="600">60</text>
  <line x1="116" y1="50" x2="132" y2="50" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="116" y1="140" x2="132" y2="140" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="120" y1="50" x2="120" y2="140" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="104" y="99" class="sk-dim-text" text-anchor="middle" font-size="12" font-weight="600">35</text>
  <line x1="388" y1="50" x2="404" y2="50" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="388" y1="140" x2="404" y2="140" class="sk-dim" fill="none" stroke-width="1"/>
  <line x1="400" y1="50" x2="400" y2="140" class="sk-dim" fill="none" stroke-width="1"/>
  <text x="416" y="99" class="sk-dim-text" text-anchor="middle" font-size="12" font-weight="600">35</text>
  <rect x="60" y="182" width="400" height="24" class="sk-ui" rx="6"/>
  <text x="72" y="199" class="sk-ui-text" font-size="11">Over-constrained: the red geometry has a constraint too many</text>
</svg>
